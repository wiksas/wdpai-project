services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app/
    links:
      - php
    networks:
      - pg-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Domyślne wartości deweloperskie (jak w .env.example), więc projekt rusza bez .env; .env je nadpisuje.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wdpai_db}
      POSTGRES_USER: ${POSTGRES_USER:-wdpai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wdpai_password}
    networks:
      - pg-network
    volumes:
      # Schemat (01-schema.sql) wykonuje się przy pierwszym starcie pustej bazy.
      - ./docker/db:/docker-entrypoint-initdb.d
      # Dane bazy (konta) przetrwają `docker compose down` i przebudowę kontenera.
      - pg-data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wdpai_db}
      POSTGRES_USER: ${POSTGRES_USER:-wdpai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wdpai_password}
      # Adres w linkach z e-maili (np. potwierdzenie konta).
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Poczta: Mailpit przechwytuje wiadomości (SMTP mailpit:1025, podgląd w przeglądarce).
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@komorebi.local}
      MAIL_PREVIEW_URL: http://localhost:${MAILPIT_PORT:-8025}
      # Skaner zdjęć i konsultant: domyślnie usługa `ollama` z tego pliku (pierwsze użycie wymaga `ollama pull`).
      # OLLAMA_URL w .env kieruje zapytania Kliniki do Ollamy na innym komputerze, np. z kartą graficzną.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:7b}
      # Konsultant w Klinice: osobny model do rozmowy (lepsza polszczyzna niż model wizyjny).
      CHAT_MODEL: ${CHAT_MODEL:-gemma3:4b}
    depends_on:
      - db
      - mailpit
    networks:
      - pg-network

  # Bez GPU Ollama liczy na procesorze (działa na każdym komputerze, analiza zdjęcia trwa dłużej).
  # Karta NVIDIA: dołącz docker-compose.gpu.yaml (COMPOSE_FILE w .env, opis w README).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pg-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - pg-network

  pgadmin-wdpai:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pg-admin}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - pg-network

networks:
  pg-network:

volumes:
  pg-data:
  ollama_data:
